<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Playfair+Display:ital,wght@1,700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Cold-open hook: viewer's question as text (no questioner voice) while the ustaz's answer plays underneath. */
      :root {
        --ink: #ffffff;
        --gold: #f2c46d;
        --gold-deep: #c9973f;
        --font-display: "Montserrat", sans-serif;
        --font-accent: "Playfair Display", serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      #scrim {
        position: absolute; left: 0; top: 0; width: 1080px; height: 860px;
        background: linear-gradient(180deg, rgba(8,10,14,0.82) 0%, rgba(8,10,14,0.6) 50%, rgba(8,10,14,0) 100%);
      }
      #pill {
        position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 90px;
        padding: 12px 30px; border-radius: 999px;
        border: 2px solid rgba(242,196,109,0.85); background: rgba(20,16,8,0.45);
        color: var(--gold); font-weight: 800; font-size: 28px; letter-spacing: 0.22em; white-space: nowrap;
      }
      .line {
        position: absolute; left: 0; width: 1080px; text-align: center;
        color: var(--ink); font-weight: 800; font-size: 62px; line-height: 1.1; letter-spacing: -0.01em;
        text-shadow: 0 6px 30px rgba(0,0,0,0.55);
      }
      #l1 { top: 172px; }
      #l2 { top: 250px; }
      #l3 { top: 328px; }
      #ask {
        position: absolute; left: 0; width: 1080px; top: 410px; text-align: center;
        color: var(--ink); font-weight: 900; font-size: 76px; letter-spacing: -0.01em;
        text-shadow: 0 8px 36px rgba(0,0,0,0.6);
      }
      #ask em { font-family: var(--font-accent); font-style: italic; font-weight: 700; color: var(--gold); font-size: 96px; }
      #verdict {
        position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 548px;
        display: flex; align-items: center; gap: 18px;
        padding: 14px 34px 14px 20px; border-radius: 999px;
        background: linear-gradient(180deg, #f6d184, #d9a548);
        box-shadow: 0 12px 40px rgba(0,0,0,0.45), 0 0 0 4px rgba(242,196,109,0.25);
        color: #1b1408; font-weight: 900; font-size: 44px; letter-spacing: 0.04em; white-space: nowrap;
      }
      #verdict .tick {
        width: 56px; height: 56px; border-radius: 28px; background: #1b1408;
        display: flex; align-items: center; justify-content: center;
      }
      #verdict small { font-weight: 700; font-size: 30px; letter-spacing: 0.12em; opacity: 0.8; }
      #glint {
        position: absolute; top: 540px; left: -300px; width: 200px; height: 90px;
        background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,250,230,0.7) 50%, rgba(255,255,255,0) 100%);
        mix-blend-mode: screen; filter: blur(4px);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.9" data-width="1080" data-height="1920">
      <div id="scrim" class="clip" data-start="0" data-duration="7.9" data-track-index="0"></div>
      <div id="pill" class="clip" data-start="0" data-duration="7.9" data-track-index="1">SOALAN PENONTON</div>
      <div id="l1" class="line clip" data-start="0" data-duration="7.9" data-track-index="2">Suami tak nak ceraikan,</div>
      <div id="l2" class="line clip" data-start="0" data-duration="7.9" data-track-index="3">tapi dah abaikan saya</div>
      <div id="l3" class="line clip" data-start="0" data-duration="7.9" data-track-index="4">bertahun-tahun…</div>
      <div id="ask" class="clip" data-start="0" data-duration="7.9" data-track-index="5">Boleh tuntut <em>fasakh?</em></div>
      <div id="verdict" class="clip" data-start="0" data-duration="7.9" data-track-index="6">
        <span class="tick">
          <svg width="32" height="32" viewBox="0 0 24 24"><path id="tickpath" d="M4 12.5l5 5L20 6.5" fill="none" stroke="#f2c46d" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="26" stroke-dashoffset="26"/></svg>
        </span>
        <span>BOLEH</span><small>— JAWAPAN USTAZ</small>
      </div>
      <div id="glint" class="clip" data-start="0" data-duration="7.9" data-track-index="7"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 0);
      tl.fromTo("#pill", { opacity: 0, y: -20, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "power3.out" }, 0.0);
      // The question lands fast so it reads before the answer does.
      tl.fromTo("#l1", { opacity: 0, y: 36, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.08);
      tl.fromTo("#l2", { opacity: 0, y: 36, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.28);
      tl.fromTo("#l3", { opacity: 0, y: 36, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.48);
      tl.fromTo("#ask", { opacity: 0, scale: 1.16, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0.8);
      // Verdict stamp on "...maka boleh" (~2.3s), glint again on "...pun boleh" (~7.2s).
      tl.fromTo("#verdict", { opacity: 0, scale: 1.6, rotation: -6 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, 2.28);
      tl.to("#tickpath", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 2.45);
      tl.fromTo("#glint", { x: 0, opacity: 0 }, { x: 1500, opacity: 1, duration: 0.9, ease: "power2.inOut" }, 2.6);
      tl.to("#verdict", { scale: 1.08, duration: 0.18, ease: "power2.out", yoyo: true, repeat: 1 }, 7.05);
      // Exit into the main talk ("Baik. Dalam Islam...").
      tl.to(["#pill", "#l1", "#l2", "#l3", "#ask", "#verdict"], { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.45, ease: "power2.in", stagger: 0.03 }, 7.35);
      tl.to("#scrim", { opacity: 0, duration: 0.5, ease: "power2.in" }, 7.4);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
