<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Playfair+Display:ital,wght@1,700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #ffffff;
        --gold: #f2c46d;
        --gold-deep: #c9973f;
        --font-display: "Montserrat", sans-serif;
        --font-accent: "Playfair Display", serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: transparent;
      }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
      #scrim {
        position: absolute; left: 0; top: 0; width: 1080px; height: 900px;
        background: linear-gradient(180deg, rgba(8,10,14,0.78) 0%, rgba(8,10,14,0.55) 45%, rgba(8,10,14,0) 100%);
      }
      #pill {
        position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 120px;
        padding: 14px 34px; border-radius: 999px;
        border: 2px solid rgba(242,196,109,0.85);
        background: rgba(20,16,8,0.45);
        color: var(--gold); font-weight: 800; font-size: 30px; letter-spacing: 0.22em;
        white-space: nowrap;
      }
      .line {
        position: absolute; left: 0; width: 1080px; text-align: center;
        color: var(--ink); font-weight: 800; font-size: 66px; line-height: 1.1;
        letter-spacing: -0.01em;
        text-shadow: 0 6px 30px rgba(0,0,0,0.55);
      }
      #l1 { top: 215px; }
      #l2 { top: 298px; }
      #l3 { top: 381px; }
      #ask {
        position: absolute; left: 0; width: 1080px; top: 478px; text-align: center;
        color: var(--ink); font-weight: 900; font-size: 80px; letter-spacing: -0.01em;
        text-shadow: 0 8px 36px rgba(0,0,0,0.6);
      }
      #ask em {
        font-family: var(--font-accent); font-style: italic; font-weight: 700;
        color: var(--gold); font-size: 100px;
      }
      #rule {
        position: absolute; top: 600px; left: 290px; width: 500px; height: 6px; border-radius: 3px;
        background: linear-gradient(90deg, rgba(242,196,109,0), var(--gold) 20%, var(--gold) 80%, rgba(242,196,109,0));
        transform-origin: 50% 50%;
      }
      #glint {
        position: absolute; top: 470px; left: -300px; width: 220px; height: 160px;
        background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,240,200,0.45) 50%, rgba(255,255,255,0) 100%);
        mix-blend-mode: screen; filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.2" data-width="1080" data-height="1920">
      <div id="scrim" class="clip" data-start="0" data-duration="7.2" data-track-index="0"></div>
      <div id="pill" class="clip" data-start="0" data-duration="7.2" data-track-index="1">SOALAN PENONTON</div>
      <div id="l1" class="line clip" data-start="0" data-duration="7.2" data-track-index="2">Suami tak nak ceraikan,</div>
      <div id="l2" class="line clip" data-start="0" data-duration="7.2" data-track-index="3">tapi dah abaikan saya</div>
      <div id="l3" class="line clip" data-start="0" data-duration="7.2" data-track-index="4">bertahun-tahun…</div>
      <div id="ask" class="clip" data-start="0" data-duration="7.2" data-track-index="5">Boleh tuntut <em>fasakh?</em></div>
      <div id="rule" class="clip" data-start="0" data-duration="7.2" data-track-index="6"></div>
      <div id="glint" class="clip" data-start="0" data-duration="7.2" data-track-index="7"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#scrim", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo("#pill", { opacity: 0, y: -24, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" }, 0.0);
      // lines rise in, timed to the voice ("Untuk ceraikan, suami tak nak ceraikan" ~0-3.4s, "dia dah abaikan saya bertahun-tahun" ~3.4-7.2s)
      tl.fromTo("#l1", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 0.1);
      tl.fromTo("#l2", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 1.3);
      tl.fromTo("#l3", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "power3.out" }, 2.85);
      // the question lands with the voice ("Bolehkah saya nak tuntut fasakh?" ~7.4s)
      tl.fromTo("#ask", { opacity: 0, scale: 1.18, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.75, ease: "expo.out" }, 3.95);
      tl.fromTo("#rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.8, ease: "power4.out" }, 4.25);
      tl.fromTo("#glint", { x: 0, opacity: 0 }, { x: 1700, opacity: 1, duration: 1.1, ease: "power2.inOut" }, 4.65);
      // exit
      tl.to(["#pill", "#l1", "#l2", "#l3", "#ask", "#rule"], { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.6, ease: "power2.in", stagger: 0.04 }, 6.2);
      tl.to("#scrim", { opacity: 0, duration: 0.8, ease: "power2.in" }, 6.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
