<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Typography layer for the halal-certificate TikTok cut.
     Renders transparent (MOV ProRes 4444) and is composited over the base picture by FFmpeg.
     All timing comes from timeline.js, generated by pipeline/timeline.py. -->
<style>
@font-face{font-family:"Sora";font-weight:600;src:url(assets/sora-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Sora";font-weight:700;src:url(assets/sora-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;src:url(assets/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:600;src:url(assets/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;font-style:italic;src:url(assets/inter-latin-500-italic.woff2) format("woff2")}
:root{--navy:#0E1E3F;--navy-a:rgba(14,30,63,.84);--gold:#C9A24B;--gold-lit:#E9C46A;--white:#FFFFFF}
html,body{margin:0;background:transparent;width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:"Inter",sans-serif;color:var(--white)}
.abs{position:absolute}
/* captions: bottom of block at 68% height, clear of TikTok caption zone and button rail */
.cap{left:110px;width:800px;bottom:610px;text-align:center;font:600 50px/1.2 "Sora",sans-serif;opacity:0;
  text-shadow:0 2px 10px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.6)}
.cap.q{font:italic 500 46px/1.25 "Inter",sans-serif;color:#EEF1F7}
.w{display:inline-block;opacity:0;margin:0 .13em}
.w.em{color:var(--gold-lit)}
.soalan{left:50%;top:1060px;transform:translateX(-50%);font:600 24px "Inter";letter-spacing:.2em;color:var(--gold-lit);
  border:2px solid var(--gold);border-radius:999px;padding:8px 22px 8px 26px;background:var(--navy-a);opacity:0}
/* hook */
.hook{left:72px;top:250px;width:760px;padding:30px 34px 34px;background:var(--navy-a);border-radius:6px;opacity:0;
  box-shadow:0 10px 40px rgba(0,0,0,.35)}
.hook .l{display:block;font:700 62px/1.15 "Sora";overflow:hidden}
.hook .l span{display:inline-block}
.hook .gold{color:var(--gold-lit);position:relative}
.hook .ul{position:absolute;left:0;bottom:-6px;height:6px;width:100%;background:var(--gold);transform-origin:left;transform:scaleX(0)}
/* lower third */
.lt{left:72px;top:1360px;width:820px;opacity:1}
.lt .panel{position:absolute;inset:0;background:var(--navy-a);border-top:3px solid var(--gold);transform-origin:left;transform:scaleX(0);border-radius:2px}
.lt .in{position:relative;padding:22px 28px 24px;display:grid;gap:6px}
.lt .name{font:600 40px/1.15 "Sora";opacity:0}
.lt .role{font:600 28px/1.2 "Inter";color:var(--gold-lit);opacity:0}
.lt .unit{font:500 22px/1.35 "Inter";color:rgba(255,255,255,.82);opacity:0}
/* chapter tag */
.chap{left:72px;top:190px;display:flex;align-items:center;gap:14px;background:var(--navy-a);border-radius:999px;padding:10px 26px 10px 10px;opacity:0}
.chap .n{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font:700 26px "Sora"}
.chap .lab{font:600 26px "Inter";letter-spacing:.2em}
/* wipe */
.wipe{visibility:hidden;left:-1500px;top:-200px;width:1300px;height:2320px;background:var(--navy);transform:skewX(-12deg);box-shadow:14px 0 0 var(--gold)}
.wipe .lab{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) skewX(12deg);white-space:nowrap;font:700 72px "Sora";letter-spacing:.06em}
.wipe .lab b{color:var(--gold-lit)}
/* keyword chips */
.chips{left:72px;top:400px;display:grid;gap:16px;justify-items:start}
.chip{display:flex;align-items:center;gap:14px;background:var(--navy-a);border-radius:999px;padding:12px 26px 12px 20px;font:600 30px "Inter";opacity:0}
.chip i{width:12px;height:12px;border-radius:50%;background:var(--gold)}
/* emphasis */
.emph{left:0;width:1080px;top:300px;display:flex;justify-content:center;align-items:center;gap:22px;opacity:0}
.emph .t{font:700 54px "Sora";color:var(--gold-lit);letter-spacing:.06em;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.emph .r{height:3px;width:70px;background:var(--white);opacity:.85}
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-start="0" data-duration="78.4667" data-width="1080" data-height="1920"></div>
<script src="assets/gsap.min.js"></script>
<script src="timeline.js"></script>
<script>
(function(){
  const T = window.TL, G = T.gfx, root = document.getElementById("root");
  const el = (cls, html, parent=root) => { const d=document.createElement("div"); d.className="abs "+cls; d.innerHTML=html||""; parent.appendChild(d); return d; };
  const tl = gsap.timeline({ paused:true });
  const E = "power3.out";

  // Kinetic captions: words rise in as spoken; emphasis words are gold.
  T.captions.forEach(c => {
    const d = el("cap"+(c.style==="q"?" q":""), c.words.map(w=>`<span class="w${w.em?" em":""}">${w.t}</span>`).join(" "));
    const ws = d.querySelectorAll(".w");
    tl.set(d,{opacity:1},c.s);
    c.words.forEach((w,i)=> tl.fromTo(ws[i],{opacity:0,y:14},{opacity:1,y:0,duration:.16,ease:E}, Math.max(c.s, w.at-0.04)));
    tl.to(d,{opacity:0,duration:.08},c.e);
  });

  // SOALAN tag for the off-camera interviewer.
  const so = el("soalan","SOALAN");
  tl.fromTo(so,{opacity:0,y:10},{opacity:1,y:0,duration:.3,ease:E},G.soalan.s+.05).to(so,{opacity:0,duration:.15},G.soalan.e-.15);

  // Hook card.
  const h = el("hook",`<span class="l"><span>${G.hook.lines[0]}</span></span><span class="l"><span>sijil halal <span class="gold">ditarik.<i class="ul abs"></i></span></span></span>`);
  const hl = h.querySelectorAll(".l > span");
  tl.fromTo(h,{opacity:0},{opacity:1,duration:.2},G.hook.s)
    .fromTo(hl,{yPercent:110},{yPercent:0,duration:.45,stagger:.12,ease:E},G.hook.s)
    .to(h.querySelector(".ul"),{scaleX:1,duration:.4,ease:"power2.inOut"},G.hook.s+.75)
    .to(h,{opacity:0,y:-10,duration:.2},G.hook.e-.2);

  // Lower third.
  const L = G.lowerThird, lt = el("lt",`<div class="panel"></div><div class="in"><div class="name">${L.name}</div><div class="role">${L.role}</div><div class="unit">${L.unit}</div></div>`);
  tl.to(lt.querySelector(".panel"),{scaleX:1,duration:.45,ease:"power3.inOut"},L.s)
    .fromTo(lt.querySelectorAll(".name,.role,.unit"),{opacity:0,y:12},{opacity:1,y:0,duration:.35,stagger:.1,ease:E},L.s+.2)
    .to(lt,{opacity:0,duration:.25},L.e-.25);

  // Chapter tags + the one designed transition (wipe into Teknikal).
  G.chapters.forEach(ch=>{
    const c = el("chap",`<span class="n">${ch.n}</span><span class="lab">${ch.label}</span>`);
    const sIn = ch.wipe ? ch.wipe+.55 : ch.s+.1;
    tl.fromTo(c,{opacity:0,x:-20},{opacity:1,x:0,duration:.35,ease:E},sIn).to(c,{opacity:0,duration:.2},ch.e-.2);
    if (ch.wipe){
      const w = el("wipe",`<div class="lab">${ch.n} · <b>${ch.label}</b></div>`);
      tl.set(w,{autoAlpha:0},0).set(w,{autoAlpha:1},ch.wipe)
        .fromTo(w,{x:0},{x:1450,duration:.42,ease:"power2.in"},ch.wipe)
        .to(w,{x:2900,duration:.42,ease:"power2.out"},ch.wipe+.42)
        .set(w,{autoAlpha:0},ch.wipe+.86);
    }
  });

  // Keyword chips (shot 06).
  const chips = el("chips","");
  G.chips.forEach(k=>{
    const c = el("chip",`<i></i>${k.t}`,chips); c.classList.remove("abs");
    tl.fromTo(c,{opacity:0,x:-24},{opacity:1,x:0,duration:.3,ease:E},k.s);
  });
  tl.to(chips,{opacity:0,duration:.2},G.chipsEnd);

  // Emphasis line (shot 12-13).
  const em = el("emph",`<span class="r"></span><span class="t">${G.emphasis.t}</span><span class="r"></span>`);
  tl.fromTo(em,{opacity:0,y:10},{opacity:1,y:0,duration:.3,ease:E},G.emphasis.s)
    .fromTo(em.querySelectorAll(".r"),{scaleX:0},{scaleX:1,duration:.4,ease:E},G.emphasis.s+.1)
    .to(em,{opacity:0,duration:.2},G.emphasis.e-.2);

  tl.set({}, {}, T.duration); // pin timeline length to the film
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
  root.setAttribute("data-duration", T.duration);
})();
</script>
</body>
</html>
