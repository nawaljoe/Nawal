<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #07090c; }
      #root { position: relative; width: 100%; height: 100%; }
      .clip { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- Pratonton: intro (0–6s) lalu outro (6–13s). Remotion memasukkan render setiap satu secara berasingan. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="13" data-width="1080" data-height="1920">
      <div id="scene-intro" class="clip" data-composition-id="intro" data-composition-src="compositions/intro.html" data-start="0" data-duration="6"></div>
      <div id="scene-outro" class="clip" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="6" data-duration="7"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
