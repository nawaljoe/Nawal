<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #07090c;
        --ink: #f6efe2;
        --gold: #e3c287;
        --muted: rgba(246, 239, 226, 0.72);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      #bg { width: 100%; height: 100%; object-fit: cover; }
      #shade {
        background:
          radial-gradient(ellipse 90% 60% at 50% 50%, rgba(7, 9, 12, 0.4) 0%, rgba(7, 9, 12, 0.9) 100%),
          linear-gradient(180deg, rgba(7, 9, 12, 0.5) 0%, rgba(7, 9, 12, 0.45) 45%, rgba(7, 9, 12, 0.92) 100%);
      }
      #stack {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 110px;
      }
      #ar { font-family: "Amiri", serif; font-size: 76px; color: var(--gold); direction: rtl; margin-bottom: 40px; }
      #rule { width: 220px; height: 2px; background: var(--gold); opacity: 0.8; margin-bottom: 48px; }
      #line1 { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 112px; color: var(--ink); line-height: 1.05; }
      #line2 {
        margin-top: 44px; font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500;
        font-size: 52px; color: var(--muted); line-height: 1.3;
      }
      #line2 b { color: var(--gold); font-weight: 500; }
      #fade { background: #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="outro" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <video id="bg" class="clip" data-layout-allow-overflow src="../assets/bg-outro.mp4" data-start="0" data-duration="5.3" muted playsinline></video>
      <div id="shade" class="clip" data-start="0" data-duration="7"></div>
      <div id="stack" class="clip" data-start="0" data-duration="7">
        <div id="ar">بَارَكَ ٱللَّهُ فِيكُمْ</div>
        <div id="rule"></div>
        <div id="line1">Semoga<br />Bermanfaat</div>
        <div id="line2">Puasa, sabar dan memaafkan —<br /><b>ganjarannya di sisi Allah.</b></div>
      </div>
      <div id="fade" class="clip" data-start="0" data-duration="7"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const calm = "sine.out";
      tl.fromTo("#bg", { scale: 1.02 }, { scale: 1.12, duration: 7, ease: "none" }, 0);
      tl.fromTo("#ar", { opacity: 0, y: 16, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.4, ease: calm }, 0.5);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "power2.inOut" }, 1.1);
      tl.fromTo("#line1", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.5, ease: calm }, 1.4);
      tl.fromTo("#line2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.3, ease: calm }, 2.4);
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "sine.inOut" }, 5.6);
      window.__timelines["outro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
