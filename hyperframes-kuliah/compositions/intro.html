<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=block"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #07090c;
        --ink: #f6efe2;
        --gold: #e3c287;
        --muted: rgba(246, 239, 226, 0.72);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: var(--ground);
      }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .clip { position: absolute; inset: 0; }
      #bg { width: 100%; height: 100%; object-fit: cover; }
      #shade {
        background:
          radial-gradient(ellipse 90% 60% at 50% 46%, rgba(7, 9, 12, 0.35) 0%, rgba(7, 9, 12, 0.88) 100%),
          linear-gradient(180deg, rgba(7, 9, 12, 0.55) 0%, rgba(7, 9, 12, 0.35) 40%, rgba(7, 9, 12, 0.9) 100%);
      }
      #glow {
        background: radial-gradient(circle at 50% 44%, rgba(227, 194, 135, 0.22) 0%, rgba(227, 194, 135, 0) 55%);
      }
      #stack {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 0 96px;
      }
      #basmalah {
        font-family: "Amiri", serif; font-size: 64px; color: var(--gold); direction: rtl;
        margin-bottom: 64px;
      }
      #rule { width: 280px; height: 2px; background: var(--gold); opacity: 0.8; margin-bottom: 44px; }
      #kicker {
        font-family: "Inter", sans-serif; font-weight: 500; font-size: 30px; letter-spacing: 0.3em;
        color: var(--muted); text-transform: uppercase; margin-bottom: 40px; line-height: 1.6;
      }
      #title { font-family: "Cormorant Garamond", serif; font-weight: 600; color: var(--ink); line-height: 1.02; }
      #title .l { display: block; font-size: 132px; }
      #title .l.em { font-style: italic; font-weight: 500; color: var(--gold); }
      #three {
        margin-top: 64px; font-family: "Cormorant Garamond", serif; font-size: 52px; color: var(--ink);
        letter-spacing: 0.04em;
      }
      #three .dot { color: var(--gold); padding: 0 18px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="intro" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <video id="bg" class="clip" data-layout-allow-overflow src="../assets/bg-intro.mp4" data-start="0" data-duration="6" muted playsinline></video>
      <div id="shade" class="clip" data-start="0" data-duration="6"></div>
      <div id="glow" class="clip" data-start="0" data-duration="6"></div>
      <div id="stack" class="clip" data-start="0" data-duration="6">
        <div id="basmalah">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
        <div id="rule"></div>
        <div id="kicker">Kuliah · Masjid Jamek<br />Batu 10, Skudai</div>
        <h1 id="title">
          <span class="l">Amalan</span>
          <span class="l em">yang Ganjarannya</span>
          <span class="l">Tiada Batas</span>
        </h1>
        <div id="three">Puasa<span class="dot">·</span>Sabar<span class="dot">·</span>Memaafkan</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const calm = "sine.out";
      // slow cinematic push on the footage
      tl.fromTo("#bg", { scale: 1.14 }, { scale: 1.02, duration: 6, ease: "none" }, 0);
      tl.fromTo("#glow", { opacity: 0 }, { opacity: 1, duration: 2.5, ease: calm }, 0.4);
      tl.fromTo("#basmalah", { opacity: 0, y: 18, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.4, ease: calm }, 0.3);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power2.inOut" }, 1.0);
      tl.fromTo("#kicker", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 1.1, ease: calm }, 1.3);
      tl.fromTo("#title .l", { opacity: 0, y: 36, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.5, ease: calm, stagger: 0.32 }, 1.7);
      tl.fromTo("#three", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.2, ease: calm }, 3.2);
      // ease the text away so Remotion can dissolve into the first shot
      tl.to("#stack", { opacity: 0, y: -18, filter: "blur(8px)", duration: 1.0, ease: "sine.in" }, 5.0);
      window.__timelines["intro"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
